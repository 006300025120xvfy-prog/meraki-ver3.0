<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DRAW RUN</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <script src="se-common.js"></script>

  <script>
    // HTML素材：どのフォルダにあっても読み込む
    window.__assetDirs = ["","map/","skin/","UI/","ui/","sound/","assets/","img/","images/","audio/"];
    window.bindFlexibleAsset = function(el, name) {
      if (!el || !name) return;
      var base = String(name).split("/").pop();
      var list = [], seen = {};
      function add(p) { if (p && !seen[p]) { seen[p]=1; list.push(p); } }
      add(name); add(base);
      // よくある別名
      if (base === "btn-survey.png") {
        ["survey.png","btn_survey.png","アンケート.png","enquete.png","questionnaire.png"].forEach(function(a){ add(a); });
      }
      window.__assetDirs.forEach(function(d){
        add(d + base);
        if (base === "btn-survey.png") {
          ["survey.png","btn_survey.png"].forEach(function(a){ add(d + a); });
        }
      });
      var i = 0;
      function tryNext() {
        if (i >= list.length) {
          // 全部失敗
          if (el.id === "survey-btn-img" || (el.getAttribute("data-asset") === "btn-survey.png")) {
            el.style.display = "none";
            var p = el.parentElement;
            if (p) p.classList.add("no-img");
          }
          return;
        }
        var url = list[i++];
        if (el.tagName === "AUDIO" || el.tagName === "VIDEO") {
          var onErr = function(){ el.removeEventListener("error", onErr); tryNext(); };
          el.addEventListener("error", onErr);
          el.src = url;
          try { el.load(); } catch(e) {}
        } else {
          el.onerror = function(){ tryNext(); };
          el.onload = function(){
            if (!el.naturalWidth) return;
            el.style.display = "";
            if (el.id === "survey-btn-img") {
              var sp = el.parentElement;
              if (sp) sp.classList.remove("no-img");
            }
          };
          el.src = url;
        }
      }
      tryNext();
    };
    document.addEventListener("DOMContentLoaded", function() {
      document.querySelectorAll("[data-asset]").forEach(function(el) {
        window.bindFlexibleAsset(el, el.getAttribute("data-asset"));
        el.addEventListener("load", function() {
          if (!el.naturalWidth) return;
          var p = el.parentElement;
          if (p && (p.id === "mode-select-title" || p.id === "mode-select-subtitle" || p.id === "world-banner")) {
            p.classList.add("has-img");
          }
          // タイトルロゴにサブ文言も入っている想定 → 下の文字を出さない
          if (p && p.id === "mode-select-title") {
            var scr = document.getElementById("mode-select-screen");
            if (scr) scr.classList.add("title-has-logo");
          }
          if (el.classList.contains("map-select-bg")) {
            var scr2 = document.getElementById("mode-select-screen");
            if (scr2) scr2.classList.add("has-bg-img");
          }
          if (el.classList.contains("world-banner-img")) {
            var b = document.getElementById("world-banner");
            if (b) b.classList.add("has-img");
          }
          if (el.classList.contains("map-guide-bg")) {
            var g = document.getElementById("map-guide-panel");
            if (g) g.classList.add("has-img-bg");
          }
        });
      });
    });
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #111;
      font-family: 'Helvetica Neue', Arial, sans-serif;
    }

    #game-container {
      position: absolute;
      width: 400px;
      height: 700px;
      transform-origin: center center;
      overflow: hidden;
    }

    #gameCanvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #fade-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      pointer-events: none;
      z-index: 100;
      clip-path: circle(0% at 50% 50%);
      transition: clip-path 0.6s ease-in-out;
    }

    #fade-overlay.fade-in {
      clip-path: circle(150% at 50% 50%);
    }

    #fade-overlay.circle-expand {
      clip-path: circle(150% at 50% 50%);
      transition: clip-path 0.7s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #gravity-warning {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 15px;
      font-weight: bold;
      color: #ff0080;
      text-align: center;
      text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
      pointer-events: none;
      z-index: 5;
      white-space: nowrap;
      transition: opacity 0.1s;
    }

    #gravity-warning.hidden {
      opacity: 0;
    }

    #countdown-overlay {
      display: none;
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, rgba(10, 5, 30, 0.55) 0%, rgba(0, 0, 0, 0.75) 100%);
      z-index: 19;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.35s ease;
    }
    #countdown-overlay.visible {
      display: block;
      opacity: 1;
    }

    #countdown-display {
      display: none;
      position: absolute;
      top: 42%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 20;
      pointer-events: none;
      text-align: center;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #countdown-display.visible {
      display: flex;
    }

    #countdown-number {
      font-size: 92px;
      font-weight: 900;
      line-height: 1;
      color: #fff;
      letter-spacing: 2px;
      text-shadow:
        0 0 12px rgba(255, 0, 128, 0.95),
        0 0 40px rgba(255, 0, 128, 0.55),
        0 4px 0 rgba(0, 0, 0, 0.35);
      animation: cd-pop 0.55s cubic-bezier(0.22, 1.2, 0.36, 1) both;
    }
    #countdown-number.cd-3 { color: #ff6b9d; }
    #countdown-number.cd-2 { color: #ffc14d; }
    #countdown-number.cd-1 { color: #5cffb0; }
    #countdown-number.cd-go {
      color: #00ffe0;
      font-size: 78px;
      letter-spacing: 6px;
      text-shadow:
        0 0 16px rgba(0, 255, 224, 0.95),
        0 0 48px rgba(0, 200, 255, 0.65),
        0 4px 0 rgba(0, 0, 0, 0.35);
      animation: cd-go 0.7s cubic-bezier(0.22, 1.2, 0.36, 1) both;
    }

    #countdown-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 140px;
      height: 140px;
      margin: -70px 0 0 -70px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 0 rgba(255, 0, 128, 0.45);
      animation: cd-ring 0.9s ease-out both;
      pointer-events: none;
      z-index: 19;
      display: none;
    }
    #countdown-ring.visible { display: block; }

    #countdown-sub {
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0, 0, 0, 0.8);
      animation: cd-fade 0.5s ease both;
    }

    @keyframes cd-pop {
      0%   { transform: scale(0.2); opacity: 0; filter: blur(6px); }
      55%  { transform: scale(1.18); opacity: 1; filter: blur(0); }
      100% { transform: scale(1); opacity: 1; filter: blur(0); }
    }
    @keyframes cd-go {
      0%   { transform: scale(0.4) rotate(-6deg); opacity: 0; }
      50%  { transform: scale(1.25) rotate(2deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes cd-ring {
      0%   { transform: scale(0.4); opacity: 0.9; box-shadow: 0 0 0 0 rgba(255, 0, 128, 0.5); }
      100% { transform: scale(1.6); opacity: 0; box-shadow: 0 0 0 28px rgba(255, 0, 128, 0); }
    }
    @keyframes cd-fade {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #start-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('start-bg.png'), url('UI/start-bg.png'), url('ui/start-bg.png'), url('assets/start-bg.png'), url('map/start-bg.png');
      background-size: 100% 100%;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #000;
      z-index: 10;
      transition: opacity 0.5s ease;
    }

    #start-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .menu-btn {
      position: absolute;
      transform: translate(-50%, -50%);
      background: none; 
      border: none;       
      cursor: pointer;
      padding: 0;
      transition: transform 0.1s, filter 0.2s;
      text-decoration: none; 
      display: block;
    }

    .menu-btn img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .menu-btn:hover {
      transform: translate(-50%, -50%) scale(1.06);
      filter: brightness(1.08) saturate(1.1);
    }

    .menu-btn:active {
      transform: translate(-50%, -50%) scale(0.94);
    }
    .menu-btn.no-img {
      border: 1.5px solid #00e5ff;
      background: rgba(0, 30, 50, 0.85);
      border-radius: 22px;
      color: #00e5ff;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.3);
    }
    .menu-btn.no-img .img-btn-fallback {
      display: flex !important;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    /* ボタン配置（ポップUI・400px幅に収める） */
    #start-button {
      top: 58%;
      left: 50%;
      width: 340px;
      height: 88px;
      z-index: 12;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.25));
    }
    #score-attack-button {
      top: 70%;
      left: 50%;
      width: 280px;
      height: 58px;
      transform: translate(-50%, -50%);
      z-index: 12;
      padding: 0;
      border: none;
      background: none;
      box-shadow: none;
      filter: drop-shadow(0 4px 10px rgba(0, 100, 180, 0.3));
    }
    #ranking-button { top: 86%; left: 22%; width: 100px; height: 110px; z-index: 12; }
    #custom-button  { top: 86%; left: 50%; width: 100px; height: 110px; z-index: 12; }
    #howto-button   { top: 86%; left: 78%; width: 100px; height: 110px; z-index: 12; }

    #ranking-button img,
    #custom-button img,
    #howto-button img {
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.2));
    }

    /* ===== マップ風ステージ選択 ===== */
    #mode-select-screen,
    #sub-select-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 15;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12px;
      box-sizing: border-box;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(255, 255, 255, 0.45) 0%, transparent 50%),
        linear-gradient(180deg, #6ec8ff 0%, #a8e4ff 35%, #e8f8ff 70%, #fff6d6 100%);
    }

    #sub-select-screen {
      z-index: 16;
    }

    #mode-select-screen.visible,
    #sub-select-screen.visible {
      display: flex;
    }

    #mode-select-title,
    #sub-select-title {
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      text-shadow:
        0 2px 0 rgba(0, 90, 160, 0.35),
        0 4px 12px rgba(0, 80, 140, 0.25);
      margin-bottom: 2px;
      flex-shrink: 0;
      text-align: center;
    }
    #mode-select-title.has-img,
    #sub-select-title.has-img {
      font-size: 0;
      color: transparent;
      text-shadow: none;
      letter-spacing: 0;
      line-height: 0;
    }
    #mode-select-title .text-fallback,
    #mode-select-subtitle .text-fallback,
    #sub-select-title .text-fallback {
      display: inline;
    }
    #mode-select-title.has-img .text-fallback,
    #mode-select-subtitle.has-img .text-fallback,
    #sub-select-title.has-img .text-fallback {
      display: none !important;
    }
    /* タイトル画像にサブ文言も含まれている場合はサブを非表示 */
    #mode-select-screen.title-has-logo #mode-select-subtitle {
      display: none !important;
    }
    #mode-select-title img,
    #mode-select-subtitle img {
      display: none;
    }
    #mode-select-title.has-img > img,
    #mode-select-subtitle.has-img > img {
      display: block;
    }
    #mode-select-title > img,
    #sub-select-title > img {
      width: min(340px, 92%);
      height: auto;
      margin: 0 auto 2px;
      filter: drop-shadow(0 4px 10px rgba(0, 60, 120, 0.25));
      pointer-events: none;
    }

    #mode-select-subtitle {
      color: #1a5a90;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 1px;
      margin-bottom: 6px;
      text-shadow: 0 1px 0 rgba(255,255,255,0.6);
      text-align: center;
    }
    #mode-select-subtitle.has-img {
      font-size: 0;
      color: transparent;
      text-shadow: none;
      margin-bottom: 4px;
    }
    #mode-select-subtitle > img {
      width: min(280px, 85%);
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 2px 6px rgba(0, 60, 120, 0.2));
    }

    /* guide texts visible in panel */

    /* マップ選択背景画像 */
    #mode-select-screen.has-bg-img {
      background-image: none;
    }
    #mode-select-screen .map-select-bg {
      display: none;
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      pointer-events: none;
    }
    #mode-select-screen.has-bg-img .map-select-bg {
      display: block;
    }
    #mode-select-screen > *:not(.map-select-bg) {
      position: relative;
      z-index: 1;
    }

    .world-banner.has-img {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
    }
    .world-banner.has-img .world-tag,
    .world-banner.has-img .world-name {
      display: none !important;
    }
    .world-banner-img {
      display: none;
      width: min(220px, 70%);
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 2px 6px rgba(0, 60, 120, 0.2));
    }
    .world-banner.has-img .world-banner-img {
      display: block;
    }

    /* スコアアタック（マップ上部の別ルート） */
    .map-score-btn {
      width: 200px;
      height: 42px;
      border: 1.5px solid #00e5ff;
      background: rgba(0, 30, 50, 0.7);
      color: #00e5ff;
      font-size: 14px;
      font-weight: bold;
      border-radius: 22px;
      cursor: pointer;
      letter-spacing: 2px;
      margin-bottom: 10px;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.3);
      transition: transform 0.15s, box-shadow 0.2s, background 0.15s;
      flex-shrink: 0;
    }
    .map-score-btn:hover {
      transform: scale(1.05);
      background: rgba(0, 50, 80, 0.75);
      box-shadow: 0 0 24px rgba(0, 229, 255, 0.5);
    }

    /* マップ本体（スクロール可能） */
    .stage-map {
      position: relative;
      width: 100%;
      max-width: 360px;
      flex: 1;
      min-height: 0;
      margin-bottom: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
    }
    /* スクロールバー（見やすく） */
    .stage-map::-webkit-scrollbar {
      width: 6px;
    }
    .stage-map::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.4);
      border-radius: 3px;
    }
    .stage-map-inner {
      position: relative;
      width: 100%;
      min-height: 100%;
      padding-bottom: 8px;
      box-sizing: border-box;
    }

    /* 道（縦のパス）※クリックを邪魔しない */
    .map-path {
      position: absolute;
      left: 50%;
      top: 56px;
      bottom: 56px;
      width: 4px;
      transform: translateX(-50%);
      background: linear-gradient(180deg,
        rgba(0, 180, 255, 0.15),
        rgba(0, 200, 255, 0.45),
        rgba(80, 140, 255, 0.4),
        rgba(0, 220, 180, 0.3)
      );
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(0, 200, 255, 0.25);
      pointer-events: none;
      z-index: 0;
    }

    /* サブ用の横パス */
    .map-path-h {
      position: absolute;
      top: 50%;
      left: 36px;
      right: 36px;
      height: 4px;
      transform: translateY(-50%);
      background: linear-gradient(90deg,
        rgba(255, 0, 128, 0.3),
        rgba(0, 200, 255, 0.6),
        rgba(0, 255, 150, 0.4)
      );
      border-radius: 2px;
      pointer-events: none;
      z-index: 0;
    }

    .map-nodes {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      gap: 36px;
      padding: 20px 0 36px;
      box-sizing: border-box;
      z-index: 2;
      min-height: min-content;
      pointer-events: none;
    }
    .map-nodes .map-node {
      pointer-events: auto;
      flex-shrink: 0;
    }

    .map-nodes-h {
      flex-direction: row;
      justify-content: center;
      gap: 28px;
      padding: 24px 16px;
      align-items: center;
      min-height: 120px;
    }

    /* ノード（ステージ地点） */
    .map-node {
      position: relative;
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid #00c8ff;
      background: radial-gradient(circle at 35% 30%, #1a2a48, #0c1528 70%);
      color: #fff;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.15;
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.35),
        0 0 16px rgba(255, 0, 128, 0.35);
      transition: transform 0.15s, box-shadow 0.2s, border-color 0.2s;
      z-index: 2;
      padding: 0;
    }
    .map-node:hover {
      transform: scale(1.12);
      box-shadow:
        0 0 0 4px rgba(0,0,0,0.35),
        0 0 24px rgba(255, 0, 128, 0.65);
    }
    .map-node:active {
      transform: scale(0.96);
    }
    .map-node .node-label {
      font-size: 10px;
      opacity: 0.7;
      font-weight: normal;
    }
    .map-node .node-num {
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    /* ステージごとの色分け */
    .map-node[data-main="1"] { border-color: #5cff8d; box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 14px rgba(92,255,141,0.35); }
    .map-node[data-main="2"] { border-color: #ffb84d; box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 14px rgba(255,184,77,0.35); }
    .map-node[data-main="3"] { border-color: #7b8cff; box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 14px rgba(123,140,255,0.35); }
    .map-node[data-main="4"] { border-color: #ff4d9a; box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 14px rgba(255,77,154,0.4); }

    .map-node[data-main="1"]:hover { box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 22px rgba(92,255,141,0.6); }
    .map-node[data-main="2"]:hover { box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 22px rgba(255,184,77,0.6); }
    .map-node[data-main="3"]:hover { box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 22px rgba(123,140,255,0.6); }
    .map-node[data-main="4"]:hover { box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 22px rgba(255,77,154,0.65); }
    .map-node[data-main="5"] { border-color: #ff6633; box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 14px rgba(255,102,51,0.4); }
    .map-node[data-main="6"] { border-color: #a78bfa; box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 14px rgba(167,139,250,0.4); }
    .map-node[data-main="5"]:hover { box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 22px rgba(255,102,51,0.65); }
    .map-node[data-main="6"]:hover { box-shadow: 0 0 0 4px rgba(0,0,0,0.35), 0 0 22px rgba(167,139,250,0.65); }

    /* サブノード */
    .map-node.sub {
      width: 64px;
      height: 64px;
      font-size: 15px;
    }

    /* 未解放 */
    .map-node.locked {
      border-color: #444 !important;
      background: radial-gradient(circle at 35% 30%, #2a2a2a, #151515 70%) !important;
      color: #666 !important;
      box-shadow: 0 0 0 4px rgba(0,0,0,0.35) !important;
      cursor: not-allowed;
      filter: grayscale(0.8);
    }
    .map-node.locked:hover {
      transform: none;
      box-shadow: 0 0 0 4px rgba(0,0,0,0.35) !important;
    }
    .map-node.locked::after {
      content: "🔒";
      position: absolute;
      bottom: -2px;
      right: -2px;
      font-size: 14px;
      filter: none;
    }

    /* クリア済み */
    .map-node.cleared:not(.locked)::before {
      content: "✓";
      position: absolute;
      top: -4px;
      right: -4px;

    .deco-tree {

    .deco-bush {

      width: 40px; height: 16px;
      background: rgba(255,255,255,0.85);

      opacity: 0.9;

    .deco-house {
      width: 36px; height: 28px;
      background: #e8d5a3;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 2px 2px 0 0;
      box-shadow: 0 3px 6px rgba(0,0,0,0.25);
    }
    .deco-house::before {
      content: "";
      position: absolute;
      left: -6px; top: -16px;
      border-left: 24px solid transparent;
      border-right: 24px solid transparent;
      border-bottom: 18px solid #c45c3a;
    }
    .deco-house::after {
      content: "";
      position: absolute;
      left: 12px; bottom: 0;
      width: 10px; height: 14px;
      background: #6b3e1a;
    }
    .deco-castle {
      width: 48px; height: 44px;
      background: linear-gradient(180deg, #c8c8d0, #8a8a98);
      border: 2px solid rgba(0,0,0,0.25);
      border-radius: 2px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }
    .deco-castle::before {
      content: "";
      position: absolute;
      left: 8px; top: -18px;
      width: 28px; height: 20px;
      background: #a0a0b0;
      border: 2px solid rgba(0,0,0,0.2);
      clip-path: polygon(0 100%, 0 35%, 20% 35%, 20% 0, 40% 0, 40% 35%, 60% 35%, 60% 0, 80% 0, 80% 35%, 100% 35%, 100% 100%);
    }
    .deco-castle::after {
      content: "";
      position: absolute;
      left: 18px; bottom: 0;
      width: 12px; height: 16px;
      background: #3a3050;
    }
    .deco-pipe {
      width: 26px; height: 34px;
      background: linear-gradient(90deg, #2ecc71, #27ae60 40%, #1e8449);
      border-radius: 4px 4px 2px 2px;
      border: 2px solid rgba(0,0,0,0.2);
      box-shadow: 0 3px 6px rgba(0,0,0,0.25);
    }
    .deco-pipe::before {
      content: "";
      position: absolute;
      left: -4px; top: -6px;
      width: 30px; height: 12px;
      background: linear-gradient(90deg, #58d68d, #27ae60);
      border-radius: 4px;
      border: 2px solid rgba(0,0,0,0.15);
    }
    .deco-mushroom {
      width: 22px; height: 12px;
      background: #e74c3c;
      border-radius: 12px 12px 2px 2px;
      box-shadow: inset 0 -2px 0 rgba(0,0,0,0.15);
    }
    .deco-mushroom::after {
      content: "";
      position: absolute;
      left: 7px; top: 10px;
      width: 8px; height: 10px;
      background: #f5e6c8;
      border-radius: 0 0 2px 2px;
    }
    .deco-star {
      width: 14px; height: 14px;
      background: #ffe566;
      clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      filter: drop-shadow(0 0 4px rgba(255, 220, 80, 0.7));

    .deco-rock {

      background: #7a7a7a;
      border-radius: 40% 40% 20% 20%;
      box-shadow: 8px 4px 0 #5a5a5a;

    .deco-crystal {
      width: 16px; height: 28px;

    .deco-lava {

<script>
    function adjustScale() {
      const container = document.getElementById('game-container');
      const canvas = document.getElementById('gameCanvas');
      const designWidth = 400;  
      const designHeight = 700; 
      
      canvas.width = designWidth;
      canvas.height = designHeight;

      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;
      
      const scaleX = windowWidth / designWidth;
      const scaleY = windowHeight / designHeight;
      let scale = Math.min(scaleX, scaleY);
      
      if (scale >= 1) {
        scale = 1;
      }

      container.style.left = "50%";
      container.style.top = "50%";
      container.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener("load", adjustScale);
    window.addEventListener("resize", adjustScale);

    // ===== メニュー画面の共通SE =====
    // game.js のグローバル変数と名前が衝突しないよう、index専用の名前を使用
    const indexSfxButton = document.getElementById("index-sfx-button");

    function indexIsSeEnabled() {
      return (localStorage.getItem("drawRunSeEnabled") ?? sessionStorage.getItem("drawRunSeEnabled")) !== "false";
    }

    function indexGetSeVolume() {
      const saved = localStorage.getItem("drawRunSeVolume") ?? sessionStorage.getItem("drawRunSeVolume");
      const value = Number(saved);
      if (!Number.isFinite(value)) return 0.28;
      return Math.max(0, Math.min(100, value)) / 100;
    }

    function indexPlayButtonSfx() {
      if (!indexSfxButton || !indexIsSeEnabled()) return;

      const volume = indexGetSeVolume();
      if (volume <= 0) return;

      try {
        indexSfxButton.volume = volume;
        indexSfxButton.currentTime = 0;
        indexSfxButton.play().catch(() => {});
      } catch (e) {}
    }

    // スタートボタンは game.js 側で処理するため、ここでは画面遷移する3ボタンだけを処理
    const indexLinkButtons = document.querySelectorAll("#ranking-button, #custom-button, #howto-button");

    indexLinkButtons.forEach((btn) => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();

        indexPlayButtonSfx();

        const targetUrl = btn.href;
        setTimeout(() => {
          window.location.href = targetUrl;
        }, 250);
      });
    });

  </script>

  <script src="game.js"></script>
