<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>遊び方 | DRAW LINE RUN</title>
  <script src="se-common.js"></script>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100vw; height: 100vh;
      overflow: hidden; background-color: #111;
      font-family: 'Helvetica Neue', 'Hiragino Sans', 'Noto Sans JP', Arial, sans-serif;
    }
    #game-container {
      position: absolute;
      width: 400px; height: 700px;
      transform-origin: center center;
      overflow: hidden;
      background: linear-gradient(180deg, #7ec8ff 0%, #b8e8ff 40%, #e8f6ff 100%);
    }
    .howto-screen {
      position: relative;
      width: 100%; height: 100%;
      padding: 4px 10px 10px;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      overflow: hidden;
    }
    .howto-bg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: 0; display: none; pointer-events: none;
    }
    .howto-screen.has-bg .howto-bg { display: block; }
    .howto-screen > *:not(.howto-bg) { position: relative; z-index: 1; }

    .howto-title-wrap {
      text-align: center;
      flex-shrink: 0;
      margin-bottom: 2px;
    }
    .howto-title-wrap img {
      display: none;
      width: min(200px, 70%);
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 4px 10px rgba(0,60,120,0.2));
    }
    .howto-title-wrap.has-img img { display: block; }
    .howto-title-wrap.has-img .title-fallback { display: none; }
    .title-fallback {
      display: inline-block;
      background: linear-gradient(180deg, #f5d78a, #e8b84a);
      border: 4px solid #fff;
      border-radius: 16px;
      padding: 8px 18px 6px;
      box-shadow: 0 4px 0 #c99000, 0 6px 12px rgba(0,0,0,0.12);
    }
    .title-fallback h1 {
      margin: 0; font-size: 22px; font-weight: 900; color: #fff;
      text-shadow: 0 2px 0 rgba(0,80,140,0.25); letter-spacing: 1px;
    }
    .title-fallback .sub {
      margin-top: 2px; font-size: 11px; font-weight: 900; color: #1a6ab0;
    }

    .howto-board {
      flex: 0 0 auto;
      width: 100%;
      background: rgba(255,255,255,0.95);
      border: 3px solid #fff;
      border-radius: 16px;
      box-shadow: 0 0 0 2px #5ec8ff, 0 6px 12px rgba(20,90,160,0.15);
      padding: 8px 8px 6px;
      box-sizing: border-box;
      overflow: visible;
    }

    .howto-step {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      background: linear-gradient(180deg, #f0f8ff, #e4f2ff);
      border-radius: 12px;
      padding: 8px 10px;
      margin-bottom: 6px;
      border: 2px solid #d0e8ff;
    }
    .howto-num {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(180deg, #ffd24d, #e8a800);
      border: 3px solid #fff;
      box-shadow: 0 2px 0 #c99000;
      color: #fff;
      font-weight: 900;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .howto-icon {
      font-size: 22px;
      line-height: 1;
      flex-shrink: 0;
      width: 28px;
      text-align: center;
      margin-top: 2px;
    }
    .howto-text {
      flex: 1;
      font-size: 12px;
      font-weight: bold;
      color: #1a5a90;
      line-height: 1.45;
    }
    .howto-text strong { color: #0d6ab8; }

    .howto-note {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 8px;
      margin-top: 2px;
      font-size: 11px;
      font-weight: bold;
      color: #4a7aa0;
      background: #f5faff;
      border-radius: 12px;
      border: 2px dashed #c8e0f8;
    }

    .howto-footer {
      flex-shrink: 0;
      margin-top: 6px;
      padding-top: 0;
      text-align: center;
    }
    .howto-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 280px;
      padding: 16px 32px;
      border-radius: 999px;
      border: 4px solid #1a4a8a;
      background: linear-gradient(180deg, #ffe566 0%, #ffb800 100%);
      color: #1a2a4a;
      font-weight: 900;
      font-size: 22px;
      text-decoration: none;
      box-shadow: 0 4px 0 #c99000, 0 6px 12px rgba(0,0,0,0.12);
    }
    .howto-back:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #c99000;
    }
    .howto-back img {
      display: none; height: 88px; width: auto; max-width: 340px;
    }
    .howto-back.has-img {
      background: none; border: none; box-shadow: none; padding: 0; min-width: 0;
    }
    .howto-back.has-img img { display: block; }
    .howto-back.has-img .back-fallback { display: none; }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="howto-screen" id="howto-screen">
      <img class="howto-bg" data-asset="howto_bg.png" alt="">
      <div class="howto-title-wrap" id="howto-title-wrap">
        <img data-asset="howto_title.png" alt="遊び方">
        <div class="title-fallback">
          <h1>❓ 遊び方</h1>
          <div class="sub">線を描いて障害物を乗り越えろ！</div>
        </div>
      </div>

      <div class="howto-board">
        <div class="howto-step">
          <div class="howto-num">1</div>
          <div class="howto-icon">👆</div>
          <div class="howto-text">画面を<strong>スワイプ</strong>して線を描こう。キャラはその線の上を走れるよ。</div>
        </div>
        <div class="howto-step">
          <div class="howto-num">2</div>
          <div class="howto-icon">⚙️</div>
          <div class="howto-text"><strong>穴・壁・トゲ・レーザー</strong>に注意！うまく線で橋をかけたり避けたりしよう。</div>
        </div>
        <div class="howto-step">
          <div class="howto-num">3</div>
          <div class="howto-icon">🚩</div>
          <div class="howto-text"><strong>ステージ</strong>はゴールまで届いたらクリア。<strong>スコアアタック</strong>はどこまで走れるかに挑戦！</div>
        </div>
        <div class="howto-step">
          <div class="howto-num">4</div>
          <div class="howto-icon">🌙</div>
          <div class="howto-text">夜空エリアでは途中で<strong>能力選択</strong>ができるよ。ワープ・復活・時間停止をうまく使おう。</div>
        </div>
        <div class="howto-note">
          <span>⚙️</span>
          <span>音量などの設定はタイトル画面右上の <strong>⚙</strong> から変更できます。</span>
        </div>
      </div>

      <div class="howto-footer">
        <a class="howto-back" id="howto-back" href="index.html">
          <img data-asset="howto_btn_back.png" alt="タイトルへ">
          <span class="back-fallback">← タイトルへ</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    function adjustScale() {
      var container = document.getElementById("game-container");
      if (!container) return;
      var scale = Math.min(window.innerWidth / 400, window.innerHeight / 700);
      if (scale >= 1) scale = 1;
      container.style.left = "50%";
      container.style.top = "50%";
      container.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
    }
    window.addEventListener("load", adjustScale);
    window.addEventListener("resize", adjustScale);

    window.__assetDirs = ["", "UI/", "ui/", "map/", "assets/", "img/"];
    window.bindFlexibleAsset = window.bindFlexibleAsset || function (el, name) {
      if (!el || !name) return;
      var base = String(name).split("/").pop();
      var list = [], seen = {};
      function add(p) { if (p && !seen[p]) { seen[p] = 1; list.push(p); } }
      add(name); add(base);
      (window.__assetDirs || [""]).forEach(function (d) { add(d + base); });
      var i = 0;
      function tryNext() {
        if (i >= list.length) return;
        var url = list[i++];
        el.onerror = function () { tryNext(); };
        el.onload = function () {
          if (!el.naturalWidth) return;
          if (el.classList.contains("howto-bg")) document.getElementById("howto-screen").classList.add("has-bg");
          if (el.getAttribute("data-asset") === "howto_title.png") document.getElementById("howto-title-wrap").classList.add("has-img");
          if (el.parentElement && el.parentElement.id === "howto-back") el.parentElement.classList.add("has-img");
        };
        el.src = url;
      }
      tryNext();
    };
    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll("[data-asset]").forEach(function (el) {
        window.bindFlexibleAsset(el, el.getAttribute("data-asset"));
      });
    });
  </script>
</body>
</html>
